# Release build of 64Gram for macOS on GitHub-hosted runners.
# Uses api_id / api_hash from the repository secrets
# TDESKTOP_API_ID / TDESKTOP_API_HASH (falls back to the public test
# credentials with a warning if they are not set).

name: My macOS Release.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "GitHub runner (try Intel when arm64 runners are busy)"
        type: choice
        default: macos-latest
        options:
          - macos-latest
          - macos-15
          - macos-15-intel
  push:
    branches:
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - '64gram_changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/my-mac-release.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.bat'

concurrency:
  group: my-mac-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  macos:
    name: macOS Release
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 360

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          sudo chown -R `whoami`:admin /usr/local/share

          brew update
          brew upgrade || true
          brew install automake libtool meson nasm ninja pkg-config

          sudo mdutil -a -i off
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Libraries cache restore.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-libs-

      - name: Libraries.
        run: |
          ./$REPO_NAME/Telegram/build/prepare/mac.sh skip-release silent

      # Keeps */local/src/* (e.g. the generated wallet_engine.cpp binding),
      # which the app build compiles directly.
      - name: Free up some disk space.
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/local/src/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      # Saved right away, so a failed app build does not throw away
      # the long library build.
      - name: Libraries cache save.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: 64Gram build.
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          cd $REPO_NAME/Telegram

          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            API="-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH"
          else
            echo "::warning::TDESKTOP_API_ID / TDESKTOP_API_HASH secrets are not set, using test credentials."
            API="-D TDESKTOP_API_TEST=ON"
          fi

          ./configure.sh \
          -D CMAKE_CONFIGURATION_TYPES=Release \
          -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON \
          $API

          cmake --build ../out --config Release --parallel

      - name: Package.
        run: |
          cd $REPO_NAME/out/Release
          codesign --force --deep --sign - 64Gram.app
          ditto -c -k --sequesterRsrc --keepParent 64Gram.app "$GITHUB_WORKSPACE/64Gram-macOS.zip"

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        with:
          name: 64Gram-macOS
          path: 64Gram-macOS.zip
          retention-days: 7
